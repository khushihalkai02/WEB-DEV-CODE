<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-emerald-200 flex justify-center items-center min-h-screen">
    <div class="bg-blue-950 flex flex-col p-8 w-80 rounded-md justify-center items-center">
        <h1 class="text-white text-center mb-5 text-4xl font-bold">Login</h1>
        <form class="flex flex-col gap-4">

            <div>
                <label class="text-white block mb-1">Email</label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full p-2 border border-black rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-green-200"
                >
            </div>

            <div>
                <label class="text-white block mb-1">Password</label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full p-2 border border-black rounded-md bg-white"
                >
            </div>

            <button
                type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded-md mt-2"
            >
                Login
            </button>

        </form>



    </div>
    
</body>
</html>
